<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Proxy | Digital Identity</title>
    <style>
        body, html { margin: 0; padding: 0; background: #1a012a; color: #D4AF37; font-family: 'Garamond', serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        header { text-align: center; padding: 15px 0; border-bottom: 2px solid #D4AF37; background: rgba(26, 1, 42, 0.9); box-shadow: 0 0 20px #bf40ff; flex-shrink: 0; }
        h1 { letter-spacing: 8px; font-weight: 300; text-transform: uppercase; margin: 0; font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px #bf40ff, 0 0 20px #D4AF37; }
        .main-container { display: flex; flex-direction: column; height: calc(100vh - 60px); overflow-y: auto; padding-bottom: 50px; }
        
        /* IDENTITY UPLOAD GRID */
        .upload-section { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        .upload-card { background: rgba(20, 0, 40, 0.8); border: 1px solid #bf40ff; padding: 15px; border-radius: 15px; width: 260px; text-align: center; box-shadow: 0 0 15px rgba(191, 64, 255, 0.2); }
        .upload-card h3 { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; color: #D4AF37; }
        
        .preview-circle { width: 120px; height: 120px; border: 2px solid #D4AF37; border-radius: 50%; background: #000; margin: 0 auto 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #555; }
        .preview-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }

        input[type="file"] { display: none; }
        .custom-file-upload { background: #000; border: 1px dashed #bf40ff; color: #bf40ff; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; }

        /* CONTROL CENTER */
        .control-bar { background: rgba(15, 0, 25, 0.98); padding: 15px; border-top: 1px solid #D4AF37; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .input-row { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        input, select, textarea { background: #000; border: 1px solid #bf40ff; color: #fff; padding: 10px; border-radius: 5px; font-family: 'Garamond'; font-size: 0.85rem; width: 31%; }
        textarea { width: 64%; height: 45px; resize: none; }
        
        .btn-manifest { background: linear-gradient(45deg, #bf40ff, #D4AF37); color: #000; border: none; padding: 12px 40px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; border-radius: 5px; transition: 0.5s; box-shadow: 0 0 20px rgba(191, 64, 255, 0.4); }
        .btn-manifest:hover { transform: scale(1.05); box-shadow: 0 0 30px #bf40ff; color: #fff; }

        .vault-window { height: 350px; width: 100%; background: #fff; border-top: 2px solid #D4AF37; margin-top: 20px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<header><h1>SOVEREIGN PROXY</h1></header>

<div class="main-container">
    <div class="upload-section">
        <div class="upload-card">
            <h3>1. Identity (Your Face)</h3>
            <div class="preview-circle"><img id="face-preview" src=""><span>FACE PENDING</span></div>
            <label for="face-up" class="custom-file-upload">Upload Identity</label>
            <input id="face-up" type="file" accept="image/*" onchange="preview(event, 'face-preview')"/>
        </div>
        <div class="upload-card">
            <h3>2. Subject (Product)</h3>
            <div class="preview-circle"><img id="prod-preview" src=""><span>PRODUCT PENDING</span></div>
            <label for="prod-up" class="custom-file-upload">Upload Product</label>
            <input id="prod-up" type="file" accept="image/*" onchange="preview(event, 'prod-preview')"/>
        </div>
    </div>

    <div class="control-bar">
        <div class="input-row">
            <input type="text" id="brand" placeholder="Affiliate Brand Name">
            <input type="email" id="email" placeholder="Recipient Email">
            <input type="text" id="dna" placeholder="Desired Look (e.g. wearing lilac silk)">
        </div>
        <div class="input-row">
            <textarea id="vision" placeholder="Describe the scene: e.g. Promoting my gold crystal water bottle in a high-end gym..."></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-manifest" id="mBtn" onclick="manifest()">SYNC & MANIFEST 🥂</button>
            <button class="btn-manifest" style="background:#000; color:#D4AF37; border: 1px solid #D4AF37;" onclick="document.getElementById('vframe').src += ''">REFRESH VAULT</button>
        </div>
    </div>

    <div class="vault-window">
        <iframe id="vframe" src="https://docs.google.com/document/d/11o-5bpW5aLcayTeHHLGsdXPwbzFmR6bZeuXEQeSTqWU/preview"></iframe>
    </div>
</div>

<form id="hiddenForm" action="https://script.google.com/macros/s/AKfycbxOsjRRW0k9HHAmiXKDlC2DmyiAbdAN6pPcinCOJDlQ26oITMbpmZ5cGxtG_A8MBw3T/exec" method="POST" target="h_iframe" style="display:none;">
    <input type="hidden" name="payload" id="formP">
</form>
<iframe name="h_iframe" style="display:none;"></iframe>

<script>
    let faceBase64 = "";
    let prodBase64 = "";

    function preview(event, id) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById(id);
            output.src = reader.result;
            output.style.display = 'block';
            output.nextElementSibling.style.display = 'none';
            if(id === 'face-preview') faceBase64 = reader.result;
            else prodBase64 = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function manifest() {
        const e = document.getElementById('email').value;
        const btn = document.getElementById('mBtn');
        if(!e.includes('@')) return alert("Email Required");
        if(!faceBase64) return alert("Please upload your face first.");
        
        btn.innerText = "CLONING IDENTITY...";
        
        const data = {
            brand: document.getElementById('brand').value,
            email: e,
            dna: document.getElementById('dna').value,
            vision: document.getElementById('vision').value,
            face_img: faceBase64,
            prod_img: prodBase64
        };

        document.getElementById('formP').value = JSON.stringify(data);
        document.getElementById('hiddenForm').submit();
        
        setTimeout(() => { 
            btn.innerText = "IDENTITY SYNCED 🥂"; 
            document.getElementById('vframe').src += ''; 
        }, 15000);
    }

    // LILAC SPARKLE SCRIPT
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;let p=[];
    class Part{constructor(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.s=Math.random()*2;this.vx=Math.random()*0.4-0.2;this.vy=Math.random()*0.4-0.2}update(){this.x+=this.vx;this.y+=this.vy}draw(){ctx.fillStyle='rgba(191, 64, 255, 0.7)';ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fill()}}
    function init(){for(let i=0;i<100;i++)p.push(new Part())}function anim(){ctx.clearRect(0,0,canvas.width,canvas.height);p.forEach(x=>{x.update();x.draw()});requestAnimationFrame(anim)}init();anim();
</script>
</body>
</html>
